
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Member Directory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header class="header">
        <h1>ICT CLUB</h1>
        <h2>MEMBER DIRECTORY</h2>
        <p class="mt-3 mb-0">Student Members | Grades 7–10</p>
    </header>

    <main class="main-container">
        <div class="row g-4">
            <div class="col-lg-4">
                <section class="panel">
                    <h3 class="section-title">Add a Member</h3>
                    <label for="first-name" class="form-label">First Name</label>
                    <input type="text" id="first-name" class="form-control mb-3" placeholder="Enter first name">
                    <label for="last-name" class="form-label">Last Name</label>
                    <input type="text" id="last-name" class="form-control mb-4" placeholder="Enter last name">
                    <button type="button" class="add-button" py-click="add_member"> Add Member</button>
                    <div id="message" class="mt-3"></div>
                </section>
            </div>

            <div class="col-lg-8">
                <section class="panel">
                    <h3 class="section-title">All ICT Club Members</h3>
                    <div id="results"><p>Loading members...</p></div>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        ICT 10 | Quarter 2 Performance Activity 2 | Set Operators
    </footer>

    <script type="py" src="./main.py"></script> # I googled with part
</html>
